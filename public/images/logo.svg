<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Path for the top text curve (clockwise) -->
    <path id="topCurve" d="M 25,100 A 75,75 0 0,1 175,100" fill="none" />
    <!-- Path for the bottom text curve (clockwise) -->
    <path id="bottomCurve" d="M 175,100 A 75,75 0 0,1 25,100" fill="none" />
    
    <!-- Gradients -->
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#047857" stroke-width="3" />
  <!-- Inner Circle boundary for text -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="3,3" />
  
  <!-- Text on Path (Top) -->
  <text font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#047857" letter-spacing="1.5">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">
      KNOWLEDGE IS STRUCTURED IN
    </textPath>
  </text>
  
  <!-- Text on Path (Bottom) -->
  <text font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#ef4444" letter-spacing="2">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">
      CONSCIOUSNESS
    </textPath>
  </text>

  <!-- Decorative Orange Dots between top and bottom text -->
  <circle cx="28" cy="100" r="3" fill="#f59e0b" />
  <circle cx="172" cy="100" r="3" fill="#f59e0b" />

  <!-- Center Emblem Group -->
  <g transform="translate(0, 5)">
    <!-- Rising Sun Rays -->
    <path d="M 65,100 C 65,70 135,70 135,100 Z" fill="url(#sunGradient)" opacity="0.15" />
    <g stroke="#f59e0b" stroke-width="1.5" opacity="0.8">
      <line x1="100" y1="90" x2="100" y2="70" />
      <line x1="88" y1="92" x2="78" y2="78" />
      <line x1="112" y1="92" x2="122" y2="78" />
      <line x1="78" y1="98" x2="65" y2="90" />
      <line x1="122" y1="98" x2="135" y2="90" />
    </g>

    <!-- Tree Symbol (Stylized) -->
    <!-- Tree Trunk -->
    <path d="M 98,125 L 98,105 Q 100,102 102,105 L 102,125 Z" fill="#78350f" />
    <!-- Tree Roots -->
    <path d="M 94,127 C 97,125 103,125 106,127 C 103,126 97,126 94,127 Z" fill="#78350f" />
    
    <!-- Tree Canopy (Green Leaves layered) -->
    <!-- Layer 1 (Back/Large) -->
    <path d="M 100,75 C 80,75 75,95 100,110 C 125,95 120,75 100,75 Z" fill="url(#treeGradient)" />
    <!-- Layer 2 (Middle) -->
    <path d="M 100,80 C 85,80 82,95 100,105 C 118,95 115,80 100,80 Z" fill="#059669" opacity="0.9" />
    <!-- Layer 3 (Front/Small) -->
    <path d="M 100,85 C 90,85 88,95 100,100 C 112,95 110,85 100,85 Z" fill="#34d399" opacity="0.95" />

    <!-- Stylized lotus/consciousness base -->
    <path d="M 75,123 Q 100,133 125,123 Q 100,128 75,123 Z" fill="#047857" />
    
    <!-- MVM Text in Center -->
    <text x="100" y="142" font-family="'Times New Roman', Times, serif" font-weight="bold" font-size="18" fill="#047857" text-anchor="middle" letter-spacing="1">MVM</text>
  </g>
</svg>
